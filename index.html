                osc.stop(beepCtx.currentTime + 0.1);
            } catch { /* 沒有音效不影響功能 */ }
        }

        function onMicClick(role, btn) {
            stopSpeaking();   // 朗讀中的聲音會被麥克風收進去，在 iOS 上還會讓辨識中斷
            unlockSpeech();

            if (activeRec) { activeRec.stop(); return; }   // 錄音中再點任一顆＝結束
            const canUseModel = !!pickAsrModel() && !!navigator.mediaDevices?.getUserMedia;
            if (!navigator.onLine) {
                // 離線：改用裝置端語音辨識＋裝置端翻譯
                const from = role === 'me' ? 'zh' : state.other;
                if (!OFFLINE_LANGS.includes(state.other)) {
                    setStatus('離線中', 'offline');
                    toast(`${LANGS[state.other].label}需要連線才能翻譯`);
                    return;
                }
                const local = localSpeech[from];
                if (SpeechRecognition && local?.state === 'available') {
                    startRecording(role, btn, local.tag);
                } else if (canUseModel) {
                    startModelRecording(role, btn);   // 瀏覽器沒有裝置端語音辨識（手機）：錄音後交給 Whisper 模型
                } else {
                    setStatus('離線中', 'offline');
                    toast('離線語音辨識尚未下載，請連線後到設定下載');
                }
                return;
            }
            if (!state.apiKey) { openSettings(); return; }
            // 連線時也可以改用 App 內建的語音模型來辨識（再交給 Claude 翻譯）：
            // 使用者在設定裡指定，或這個瀏覽器根本沒有語音辨識時自動採用
            if (canUseModel && (state.asrEngine === 'model' || !SpeechRecognition)) {
                startModelRecording(role, btn);
                return;
            }
            if (!SpeechRecognition) {
                setStatus('不支援語音辨識', 'error');
                toast('此瀏覽器不支援語音辨識。可到設定下載語音辨識模型，或改用文字模式');
                return;
            }
            if (state.asrEngine === 'model') toast('尚未下載語音辨識模型，暫時改用瀏覽器的語音辨識');
            startRecording(role, btn);
        }

        const SEGMENT_PAUSE_MS = 900;        // 辨識器確定一段話後，停頓這麼久就先把這段送去翻
        const SEGMENT_STABLE_MS = 1600;      // （iOS）文字停住這麼久沒再變，也當作講完一段
        const SEGMENT_UNFINISHED_MS = 3500;  // 句子看起來還沒講完時，多等一下再送翻，免得一句話被切成兩半
        const MAX_SILENCE_MS = 45000;        // 這麼久完全沒聽到話，才自動結束聆聽
        // 無法靠重開解決的錯誤；其餘（no-speech、aborted、network…）都會接著重開
        const FATAL_REC_ERRORS = ['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'];

        /**
         * 這段話看起來是不是還沒講完（停在助詞、連接詞，或短到不成句）。
         * 只用來決定「要不要多等一下」，判斷錯了頂多是譯文晚一點出現或被切成兩段，不影響正確性。
         */
        function looksUnfinished(text, lang) {
            const t = text.trim();
            if (!t) return false;
            if (lang === 'ja') {
                // 「〜ですが」「〜んですけど」是日語常見的委婉句尾，算講完了
                if (/(です|ます|ん)(が|けど|けれど|けれども)$/.test(t)) return false;
                return t.length < 4 || /(に|を|が|は|で|と|の|も|へ|や|から|まで|より|ので|のに|けど|けれど|って|て|たら|なら|ば|し|、)$/.test(t);
            }
            if (lang === 'zh') {
                return t.length < 3 || /(的|和|跟|與|或|在|把|被|對|向|從|因為|所以|如果|雖然|但是|可是|而且|然後|就是|還有|，|、)$/.test(t);
            }
            if (lang === 'en') {
                return t.split(/\s+/).length < 2
                    || /(\b(the|a|an|to|of|in|on|at|for|with|and|or|but|so|because|if|that|my|your|is|are|was|were)|,)$/i.test(t);
            }
            if (lang === 'th') return t.length < 4;   // 泰文詞與詞之間沒有空白，不能用字數判斷
            return t.split(/\s+/).length < 2 || /,$/.test(t);
        }

        /**
         * 中日文譯文裡的半形標點換成全形（模型偶爾會混用），刪節號統一成「……」。
         * 只處理緊接在中日文字後面的標點，數字與英文裡的（38.5、U.S.）不動。
         */
        function tidyPunctuation(text, lang) {
            if (usesSpaces(lang)) return text;
            const CJK_CHAR = '[\\u3000-\\u30ff\\u3400-\\u9fff\\uff00-\\uffef]';
            let out = text.replace(/\.{3,}|。{3,}|…+/g, '……');
            const map = lang === 'zh'
                ? { '?': '？', '!': '！', ',': '，', ':': '：', ';': '；' }
                : { '?': '？', '!': '！' };
            const marks = Object.keys(map).map((m) => `\\${m}`).join('');
            // 只吃掉標點前後的空白，不動換行（圖片翻譯的結果是多行的）
            out = out.replace(new RegExp(`(${CJK_CHAR})[ \\t]*([${marks}])[ \\t]*`, 'g'), (_, ch, mark) => ch + map[mark]);
            return out;
        }

        /** 譯文缺句尾標點時補上，接在後面的下一段才不會黏在一起 */
        function endSentence(text, lang) {
            const t = text.trim();
            if (!t || /[。！？!?.…」』）)，、,]$/.test(t)) return t;
            if (lang === 'th') return t;   // 泰文不用句號，段落之間靠空白分隔
            return t + (usesSpaces(lang) ? '.' : '。');
        }

        /**
         * 連續聆聽、逐段翻譯、合併顯示。
         * 按下開始後一直聽到使用者按結束為止。每講完一小段就先把那一段送去翻，同時繼續聽下一段；
         * 辨識器遇到停頓或時間上限會自己結束，這裡會重開一個接著聽。
         * 畫面上整次聆聽只有一個對話框：原文與譯文各自接成一整段，不會一段一個框。
         */
        function startRecording(role, btn, localTag = null) {
            // 開始時就固定語言組合，錄音途中切換語言不影響這次聆聽
            const from = role === 'me' ? 'zh' : state.other;
            const to = role === 'me' ? state.other : 'zh';
            const who = role === 'me' ? '我' : '對方';
            const bubble = createBubble({
                side: role,
                tag: `${who} · ${LANGS[from].label} → ${LANGS[to].label}${localTag ? ' · 離線' : ''}`,
            });
            const SRC_GAP = ' ';                          // 原文各段之間留個空白，比較好讀
            const DST_GAP = usesSpaces(to) ? ' ' : '';       // 中日文譯文靠標點分隔，不需要空白

            // 辨識器（會重開很多次）
            let rec = null;
            let recCount = 0;             // 這次聆聽總共開過幾個辨識器
            let recActive = false;        // 目前的辨識器是否還在跑（start 之後、onend 之前）
            let recError = '';
            let sessionAll = '';          // 目前這個辨識器聽到的全部文字（已確定＋還在變動）
            let sessionHeard = false;     // 目前這個辨識器有沒有聽到東西
            let sessionStartedAt = 0;
            let committedLen = 0;         // sessionAll 之中已經送去翻譯的長度
            let quickFailures = 0;        // 連續幾次「一開就結束而且沒聽到東西」
            let restartTimer = 0;
            // 整次聆聽
            let userStopped = false;
            let stopReason = 'user';      // 被要求結束的原因（使用者按的，或 App 離開畫面）
            let ended = false;
            let lastHeardAt = Date.now();
            let commitTimer = 0;
            // 段落
            let seg = null;               // 正在聽、還沒送去翻的這一段
            const parts = [];             // 已送去翻的各段：{ src, dst, preview }，依說話順序
            let pending = 0;              // 還沒翻完的段數
            let failMessage = '';
            let turnRemembered = false;   // 這次聆聽的原文是否已記進對話上下文（重試時不要重複記）

            const newSegment = () => ({
                carry: '',                // 上一個辨識器結束時還沒講完、帶過來的文字
                finalText: '', interimText: '', text: '',
                closed: false, preview: '',
                liveTimer: 0, liveJob: null, liveJobText: '', liveQueued: '', lastLiveText: '', liveDone: null,
            });

            /** 把目前所有段落畫到同一個對話框裡 */
            function render() {
                const doneSrc = parts.map((p) => p.src).join(SRC_GAP);
                if (!doneSrc && !seg?.text) {
                    bubble.setPlaceholder('正在聆聽…');
                } else {
                    const liveFinal = seg ? seg.carry + seg.finalText : '';
                    const settled = [doneSrc, liveFinal].filter(Boolean).join(SRC_GAP);
                    const interim = seg?.interimText ?? '';
                    // 前面已有定稿的段落、而這一段只有還在變動的字時，中間也要留空白
                    bubble.setSource(settled + (doneSrc && !liveFinal && interim ? SRC_GAP : ''), interim);
                }
                // 從頭數起已經翻好的部分算定稿；後面還在翻的（或預覽）用淡色接著
                let i = 0;
                const done = [];
                while (i < parts.length && parts[i].dst !== null) done.push(parts[i++].dst);
                const working = parts.slice(i)
                    .map((p) => (p.failed ? '〔這一段翻譯失敗〕' : p.dst ?? p.preview))
                    .concat(seg?.preview ?? '').filter(Boolean);
                if (done.length || working.length || parts.length) {
                    bubble.setTranslation(done.join(DST_GAP),
                        working.length ? (done.length ? DST_GAP : '') + working.join(DST_GAP) : '');
                }
            }

            // ---- 這一段還在說的時候：即時預覽 ----
            async function runLive(s, text) {
                if (s.closed || !text) return;
                if (s.liveJob) { s.liveQueued = text; return; }   // 同時間只跑一個預覽請求
                if (text === s.lastLiveText) return;
                s.lastLiveText = text;
                const context = conversationContext(role, from, parts.slice(-3).map((p) => p.src));
                const show = (partial) => {
                    if (s.closed || s.liveJob !== job) return;
                    s.preview = partial;
                    render();
                };
                // 第一次預覽邊翻邊顯示；之後的等整段翻完才換上去，避免譯文一直從頭重新跑字
                const streamInto = s.preview ? null : show;
                // 連線時預覽用的是求快的設定，結果不拿來當最終譯文；離線（裝置端翻譯）才可以沿用
                const preview = localTag ? null : previewOptions();
                const reusable = !!localTag;
                const settleLive = (result) => {
                    if (reusable) s.liveDone = { text, result };
                    show(result);
                    return result;
                };
                const job = localTag
                    ? { promise: translateOnDevice(text, to, from).then(settleLive), abort() {} }
                    : (() => {
                        const stream = streamClaude(textContent(text, to, context), streamInto, preview);
                        const promise = stream.promise.then(settleLive, (err) => {
                            // API 不接受關閉思考時（400），之後的預覽改回預設設定
                            if (preview.thinkingOff && err?.status === 400) previewThinkingOff = false;
                            throw err;
                        });
                        return { promise, abort: stream.abort };
                    })();
                s.liveJob = job;
                s.liveJobText = reusable ? text : '';
                try { await job.promise; }
                catch { /* 預覽失敗不提示，這一段送出翻譯時才處理錯誤 */ }
                finally {
                    if (s.liveJob === job) s.liveJob = null;
                    if (!s.closed && s.liveQueued) { const next = s.liveQueued; s.liveQueued = ''; runLive(s, next); }
                }
            }

            // ---- 一段說完：送出正式翻譯 ----
            function translateSegment(s) {
                const text = s.text.trim();
                const part = {
                    src: text, dst: null, preview: s.preview, failed: false,
                    context: conversationContext(role, from, parts.slice(-3).map((p) => p.src)),
                };
                parts.push(part);
                runPart(part, s);
            }

            /** 暫時性的錯誤（斷線、逾時、服務忙碌）值得再試一次；Key 錯誤或被拒絕的再試也沒用 */
            const isTransient = (err) => !(err instanceof UserFacingError)
                && (err?.status === undefined || err.status === 408 || err.status === 429 || err.status >= 500);

            /** 翻譯一個段落。s 是它還在說時的預覽狀態（只有第一次翻才有，重試時沒有） */
            async function runPart(part, s = null) {
                const text = part.src;
                part.failed = false;
                pending++;
                render();
                if (ended) setStatus('翻譯中', 'busy');
                try {
                    let result;
                    if (s?.liveDone?.text === text) {
                        // 預覽已經用同一套模型翻過一模一樣的文字：直接沿用
                        s.liveJob?.abort();
                        s.liveJob = null;
                        result = s.liveDone.result;
                    } else if (s?.liveJob && s.liveJobText === text) {
                        result = await s.liveJob.promise;   // 同一段文字正在翻：等它就好
                    } else {
                        s?.liveJob?.abort();
                        if (s) s.liveJob = null;
                        const translateOnce = () => (localTag
                            ? translateOnDevice(text, to, from)
                            : streamClaude(textContent(text, to, part.context), (partial) => { part.preview = partial; render(); }).promise);
                        try {
                            result = await translateOnce();
                        } catch (err) {
                            // 行動網路偶爾會斷一下：暫時性的錯誤自動再試一次
                            if (!isTransient(err)) throw err;
                            diag(`翻譯暫時失敗，自動重試：${err?.name || ''}${err?.status ? ` HTTP ${err.status}` : ''}`);
                            await sleep(1000);
                            result = await translateOnce();
                        }
                    }
                    // 講完的句子補上句尾標點；被切在句子中間的片段則保持原樣，才能和下一段接起來
                    const tidy = tidyPunctuation(result, to);
                    part.dst = looksUnfinished(text, from) ? tidy.trim() : endSentence(tidy, to);
                } catch (err) {
                    failMessage = await explainError(err);
                    part.failed = true;
                } finally {
                    pending--;
                    render();
                    settle();
                }
            }

            /** 聆聽結束而且每一段都翻完後，收尾：定稿、更新狀態、朗讀 */
            function settle() {
                if (!ended || pending > 0 || !parts.length) return;
                bubble.setSource(parts.map((p) => p.src).join(SRC_GAP));
                if (!turnRemembered) {
                    turnRemembered = true;
                    rememberTurn(role, from, parts.map((p) => p.src).join(SRC_GAP));   // 給之後的句子當上下文
                }
                const failedParts = parts.filter((p) => p.failed);
                if (failedParts.length) {
                    // 有段落沒翻成功：不當成譯文、不存入歷史、不朗讀，改顯示原因與重試按鈕
                    setStatus(failMessage, 'error');
                    bubble.showRetry(failMessage, () => {
                        failMessage = '';
                        failedParts.forEach((p) => runPart(p));
                    });
                    return;
                }
                // 整段結束了，最後一句即使聽起來沒講完也補上句尾
                const full = endSentence(parts.map((p) => p.dst).join(DST_GAP), to);
                const btnSpeak = bubble.finalize(full, to);
                setIdleStatus();
                // 使用者按結束＝說完了，把整段譯文唸出來。不是使用者按的結束就不自動唸
                if (stopReason === 'user' && userStopped) speak(full, to, btnSpeak);
            }

            function commitSegment() {
                clearTimeout(commitTimer);
                const s = seg;
                if (!s || !s.text.trim()) return;
                seg = null;
                s.closed = true;
                clearTimeout(s.liveTimer);
                committedLen = sessionAll.length;
                translateSegment(s);
            }

            function handleResult(finalText, interimText) {
                const all = finalText + interimText;
                if (all === sessionAll) return;   // 內容沒變（有些瀏覽器會重複送同一筆）
                sessionAll = all;
                // 扣掉已經送去翻的開頭，剩下的才是這一段
                const freshFinal = finalText.slice(committedLen);
                const freshInterim = interimText.slice(Math.max(0, committedLen - finalText.length));
                if (!(freshFinal + freshInterim).trim()) return;
                sessionHeard = true;
                lastHeardAt = Date.now();
                const s = seg ?? (seg = newSegment());
                s.finalText = freshFinal;
                s.interimText = freshInterim;
                s.text = s.carry + freshFinal + freshInterim;
                render();
                clearTimeout(s.liveTimer);
                clearTimeout(commitTimer);
                const snapshot = s.text.trim();
                if (freshInterim.trim() && state.live && snapshot.length >= 2) {
                    // 還在說：稍等一下再出預覽，避免每個字都發請求
                    s.liveTimer = setTimeout(() => runLive(s, snapshot), LIVE_DEBOUNCE_MS);
                }
                // 什麼時候把這一段送去翻：
                //  - 句子看起來還沒講完：多等一下，讓後半句接上來
                //  - 辨識器已確定這段話：停頓一下就送
                //  - iOS 的結果常常要到整個結束才標成「已確定」，所以文字停住一陣子也算
                if (looksUnfinished(snapshot, from)) commitTimer = setTimeout(commitSegment, SEGMENT_UNFINISHED_MS);
                else if (!freshInterim.trim()) commitTimer = setTimeout(commitSegment, SEGMENT_PAUSE_MS);
                else if (IS_IOS) commitTimer = setTimeout(commitSegment, SEGMENT_STABLE_MS);
            }

            // 交給外部（按鈕、切換模式）用來結束這次聆聽的把手
            const session = {
                stop(reason = 'user') {
                    userStopped = true;
                    stopReason = reason;
                    clearTimeout(restartTimer);
                    if (!recActive) { finish(stopReason); return; }   // 正在兩個辨識器之間的空檔
                    try { rec.stop(); } catch { finish(stopReason); }
                },
            };

            function openRecognizer() {
                const r = new SpeechRecognition();
                r.lang = localTag ?? LANGS[from].rec;
                if (localTag) r.processLocally = true;
                r.interimResults = true;
                r.continuous = true;
                r.maxAlternatives = 1;

                r.onstart = () => {
                    btn.classList.add('is-recording');
                    el.voiceHint.textContent = '聆聽中… 再點一下結束';
                    setStatus(`聆聽${LANGS[from].label}`, 'listening');
                };

                r.onresult = (event) => {
                    let finalText = '';
                    let interimText = '';
                    for (const result of event.results) {
                        const piece = result[0].transcript;
                        if (!result.isFinal) { interimText += piece; continue; }
                        // Android 的連續模式會把「到目前為止的整段」重複放進每一筆結果，
                        // 直接相加會出現重複字句；新的一筆若以已有文字開頭，就視為取代而不是追加
                        const cumulative = IS_ANDROID && finalText.trim() && piece.trim().startsWith(finalText.trim());
                        finalText = cumulative ? piece : finalText + piece;
                    }
                    if (IS_ANDROID && finalText.trim() && interimText.trim().startsWith(finalText.trim())) {
                        interimText = interimText.trim().slice(finalText.trim().length);
                    }
                    handleResult(finalText, interimText);
                };

                r.onerror = (e) => { recError = e.error; diag(`辨識器 #${recCount} 錯誤：${e.error}${e.message ? ` (${e.message})` : ''}`); };

                // onerror 之後一定會接 onend，收尾統一在這裡做
                r.onend = () => {
                    if (rec !== r) return;
                    recActive = false;
                    const lived = Date.now() - sessionStartedAt;
                    diag(`辨識器 #${recCount} 結束：存活 ${lived}ms，${sessionHeard ? `聽到 ${sessionAll.length} 字` : '沒聽到東西'}，錯誤=${recError || '無'}`);
                    quickFailures = (!sessionHeard && lived < 1000) ? quickFailures + 1 : 0;
                    const fatal = FATAL_REC_ERRORS.includes(recError);
                    const silentTooLong = Date.now() - lastHeardAt > MAX_SILENCE_MS;
                    // 決定要不要接著聽
                    let reason = '';
                    if (userStopped) reason = stopReason;
                    else if (activeRec !== session) reason = 'replaced';
                    // 一開始就被拒絕是沒有權限；聽過幾段之後才被拒絕，則是瀏覽器不讓程式自己重新啟動
                    else if (fatal) reason = recCount > 1 && (recError === 'not-allowed' || recError === 'service-not-allowed') ? 'restart-blocked' : `error:${recError}`;
                    else if (silentTooLong) reason = 'silence';
                    else if (quickFailures >= 4) reason = 'quick-failures';

                    if (!reason && seg && looksUnfinished(seg.text, from)) {
                        // 句子還沒講完就換辨識器：把這半句帶到下一個辨識器，等後半句接上來再一起翻
                        clearTimeout(commitTimer);
                        seg.carry = seg.text.trim() + (usesSpaces(from) ? ' ' : '');   // 以空白分隔的語言接下去要隔一個空白
                        seg.finalText = '';
                        seg.interimText = '';
                        commitTimer = setTimeout(commitSegment, SEGMENT_UNFINISHED_MS);
                    } else {
                        // 這個辨識器聽到、但還沒送出的話，先送去翻，才不會因為它中斷而遺失
                        commitSegment();
                    }
                    if (reason) finish(reason); else restart(0);
                };

                sessionAll = '';
                sessionHeard = false;
                committedLen = 0;
                recError = '';
                sessionStartedAt = Date.now();
                rec = r;
                recCount++;
                diag(`辨識器 #${recCount} 啟動（${r.lang}${localTag ? '，裝置端' : ''}）`);
                r.start();
                recActive = true;
            }

            /** 接著開下一個辨識器。剛失敗過就稍等再試，啟動失敗最多重試三次 */
            function restart(attempt) {
                clearTimeout(restartTimer);
                restartTimer = setTimeout(() => {
                    if (userStopped || ended) { finish(stopReason); return; }
                    try {
                        openRecognizer();
                    } catch (e) {
                        diag(`重新啟動失敗（第 ${attempt + 1} 次）：${e.name} ${e.message}`);
                        if (attempt < 3) restart(attempt + 1); else finish('restart-failed');
                    }
                }, attempt || quickFailures ? 300 : 0);
            }

            // 非使用者主動結束時，告訴使用者原因，也方便回報
            const FINISH_NOTES = {
                'silence': '太久沒有聽到聲音，已停止聆聽',
                'restart-blocked': '瀏覽器不允許自動接續聆聽，要繼續請再按一次',
                'restart-failed': '無法接續聆聽，要繼續請再按一次',
                'quick-failures': '語音辨識一直無法啟動，要繼續請再按一次',
                'hidden': 'App 離開畫面，已停止聆聽',
            };

            function finish(reason = 'user') {
                if (ended) return;
                ended = true;
                if (!userStopped) stopReason = reason;
                clearTimeout(commitTimer);
                clearTimeout(restartTimer);
                if (seg?.text.trim()) {
                    commitSegment();
                } else if (seg) {
                    seg.closed = true;
                    clearTimeout(seg.liveTimer);
                    seg.liveJob?.abort();
                    seg = null;
                }
                diag(`聆聽結束：原因=${reason}，共 ${recCount} 個辨識器、${parts.length} 段`);
                releaseWakeLock();
                btn.classList.remove('is-recording');
                // 只有自己仍是目前的聆聽才重設共用狀態，避免舊的事件蓋掉新的
                if (activeRec === session) {
                    activeRec = null;
                    activeBtn = null;
                    stopMeter();
                    el.voiceHint.textContent = '點一下開始說話，再點一下結束';
                }

                if (parts.length > 0) {
                    // 不是使用者按的結束：說明原因，免得以為還在聽
                    if (reason !== 'user') {
                        toast(FINISH_NOTES[reason] ?? `聆聽中斷（${reason.replace('error:', '')}），要繼續請再按一次`);
                    }
                    if (pending > 0) setStatus('翻譯中', 'busy');
                    settle();
                    return;
                }
                // 完全沒聽到東西
                bubble.remove();
                if (localTag && (recError === 'service-not-allowed' || recError === 'language-not-supported')) {
                    setStatus('離線語音無法使用', 'error');
                    toast('離線語音包無法使用，請連線後到設定重新下載');
                } else if (recError === 'service-not-allowed' && IS_IOS && IS_STANDALONE) {
                    // iOS 把網頁加到主畫面後，有時不允許使用 Safari 的語音辨識
                    setStatus('此模式無法語音辨識', 'error');
                    toast('從主畫面開啟時 iOS 不提供語音辨識。請改用 Safari 開啟，或到設定把語音辨識方式改成「App 內建模型」');
                } else if (recError === 'not-allowed' || recError === 'service-not-allowed') {
                    setStatus('麥克風未授權', 'error');
                    toast('請允許此網站使用麥克風');
                } else if (recError === 'audio-capture') {
                    setStatus('找不到麥克風', 'error');
                } else if (recError === 'network') {
                    setStatus('語音辨識連線失敗', 'error');
                } else if (quickFailures >= 4) {
                    setStatus('語音辨識無法啟動', 'error');
                    toast('語音辨識一直無法啟動。可到設定把語音辨識方式改成「App 內建模型」，或改用文字模式');
                } else if (recError === 'no-speech' || !userStopped) {
                    setStatus('沒有聽到聲音');
                } else {
                    setIdleStatus();
                }
            }

            activeRec = session;
            activeBtn = btn;
            diag(`開始聆聽（瀏覽器辨識）：${from}→${to}${localTag ? '，離線' : ''}`);
            render();
            playBeep();
            requestWakeLock();
            // 手機上語音辨識與另一條麥克風串流無法共用，硬開波形可能讓辨識中斷，改用示意動畫
            if (IS_MOBILE) startFakeMeter(role); else startMeter(role);
            try {
                openRecognizer();
            } catch (e) {
                console.error(e);
                diag(`無法啟動語音辨識：${e.name} ${e.message}`);
                releaseWakeLock();
                ended = true;
                activeRec = null;
                activeBtn = null;
                stopMeter();
                bubble.remove();
                setStatus('無法啟動語音辨識', 'error');
            }
        }

        // ---------- 離線錄音＋Whisper 模型辨識（手機用） ----------
        const MODEL_REC_MAX_MS = 60000;   // 單次錄音上限，避免手機辨識過久或記憶體不足

        // 預覽用哪個語音模型，依這台裝置實測的速度決定：
        // 先用最小的 tiny；量到它夠快（代表 base 也跑得動）就改用較準的 base，base 太慢再退回 tiny。
        const liveAsrSpeed = {};   // { 'asr-live': 毫秒, 'asr': 毫秒 }，最近一次預覽辨識的耗時
        function pickLiveAsrModel(mainModel) {
            const hasTiny = modelKeysReady.has('asr-live');
            const hasBase = modelKeysReady.has('asr');
            // base 與 small 同時留在記憶體需要較多空間；主要模型本身就是 base 時則沒有額外負擔
            const roomy = mainModel === 'asr' || (navigator.deviceMemory ?? 4) >= 8;
            const fastEnough = liveAsrSpeed['asr-live'] < 1300 && !(liveAsrSpeed['asr'] > 3000);
            if (hasBase && roomy && (fastEnough || !hasTiny)) return 'asr';
            return hasTiny ? 'asr-live' : null;
        }

        /** 兩次辨識結果開頭相同的部分。連續兩次都一樣，才當作「已穩定」 */
        function commonPrefix(a, b) {
            let i = 0;
            while (i < a.length && i < b.length && a[i] === b[i]) i++;
            return a.slice(0, i);
        }

        /** 預覽只翻到最後一個標點為止；講到一半的殘句拿去翻，模型會亂猜 */
        function cutAtBoundary(text) {
            const m = text.match(/^[\s\S]*[。！？!?、，,.]/);
            if (m) return m[0].trim();
            const enough = /[぀-ヿ㐀-鿿]/.test(text) ? 12 : 40;   // 一直沒標點時，夠長也先翻
            return text.length >= enough ? text.trim() : '';
        }

        const LIVE_ASR_GAP_MS = 1200;    // 即時預覽：兩次辨識之間至少間隔多久
        const LIVE_ASR_MAX_S = 29;       // 超過這個長度就不再做預覽（Whisper 一次處理 30 秒）
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        /** 降到 Whisper 需要的 16 kHz：每個輸出取樣取對應區間的平均，兼作簡單的低通濾波 */
        function resampleTo16k(pcm, sampleRate) {
            if (sampleRate === 16000) return pcm;
            const ratio = sampleRate / 16000;
            const out = new Float32Array(Math.floor(pcm.length / ratio));
            for (let i = 0; i < out.length; i++) {
                const start = Math.floor(i * ratio);
                const end = Math.min(pcm.length, Math.max(start + 1, Math.floor((i + 1) * ratio)));
                let sum = 0;
                for (let j = start; j < end; j++) sum += pcm[j];
                out[i] = sum / (end - start);
            }
            return out;
        }

        /**
         * 直接擷取麥克風的原始波形（不經 MediaRecorder 壓縮），
         * 這樣錄音途中隨時能取出「到目前為止」的語音來做即時辨識。
         */
        function createPcmCapture(stream) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            ctx.resume?.().catch(() => {});
            const source = ctx.createMediaStreamSource(stream);
            const node = ctx.createScriptProcessor(4096, 1, 1);
            const mute = ctx.createGain();
            mute.gain.value = 0;   // 要接到輸出才會持續觸發，但不能把麥克風聲音放出來
            const chunks = [];
            let length = 0;
            node.onaudioprocess = (e) => {
                chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
                length += e.inputBuffer.length;
            };
            source.connect(node);
            node.connect(mute);
            mute.connect(ctx.destination);
            return {
                seconds: () => length / ctx.sampleRate,
                /** 到目前為止的全部語音，16 kHz 單聲道 */
                snapshot() {
                    const all = new Float32Array(length);
                    let offset = 0;
                    for (const c of chunks) { if (offset + c.length > length) break; all.set(c, offset); offset += c.length; }
                    return resampleTo16k(all, ctx.sampleRate);
                },
                stop() {
                    node.onaudioprocess = null;
                    source.disconnect();
                    node.disconnect();
                    ctx.close().catch(() => {});
                },
            };
        }

        /**
         * 送進模型前的整理：切掉頭尾的靜音、把音量拉到一致。
         * 靜音會讓 Whisper 憑空生出字句，音量太小則容易聽錯。完全沒有人聲時回傳 null。
         */
        function prepareSpeech(pcm) {
            const FRAME = 320;   // 20 毫秒
            const frames = Math.floor(pcm.length / FRAME);
            if (!frames) return null;
            const rms = new Float32Array(frames);
            let maxRms = 0;
            for (let f = 0; f < frames; f++) {
                let sum = 0;
                for (let i = f * FRAME, end = i + FRAME; i < end; i++) sum += pcm[i] * pcm[i];
                rms[f] = Math.sqrt(sum / FRAME);
                if (rms[f] > maxRms) maxRms = rms[f];
            }
            if (maxRms < 0.004) return null;   // 整段幾乎無聲
            const threshold = Math.max(0.003, maxRms * 0.08);
            let first = 0;
            let last = frames - 1;
            while (first < frames && rms[first] < threshold) first++;
            while (last > first && rms[last] < threshold) last--;
            const PAD = 15;   // 頭尾各留 0.3 秒，避免切到字頭字尾
            const start = Math.max(0, first - PAD) * FRAME;
            const end = Math.min(frames, last + 1 + PAD) * FRAME;
            if (end - start < 16000 * 0.3) return null;

            const out = pcm.slice(start, end);
            let peak = 0;
            for (let i = 0; i < out.length; i++) { const a = Math.abs(out[i]); if (a > peak) peak = a; }
            const gain = Math.min(20, 0.9 / peak);
            if (gain > 1.05) for (let i = 0; i < out.length; i++) out[i] *= gain;
            return out;
        }

        async function startModelRecording(role, btn) {
            const from = role === 'me' ? 'zh' : state.other;
            const to = role === 'me' ? state.other : 'zh';
            const who = role === 'me' ? '我' : '對方';

            // 先佔住「錄音中」狀態，避免等麥克風授權時被重複點擊
            let cancelled = false;
            const session = { stop() { cancelled = true; } };
            activeRec = session;
            activeBtn = btn;

            const release = () => {
                if (activeRec !== session) return;
                activeRec = null;
                activeBtn = null;
                stopMeter();
                releaseWakeLock();
                btn.classList.remove('is-recording');
                el.voiceHint.textContent = '點一下開始說話，再點一下結束';
                diag('聆聽結束（內建模型）');
            };

            let stream;
            try {
                // 單聲道並開啟降噪、回音消除、自動增益，嘈雜環境下辨識較穩
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                });
            } catch (e) {
                diag(`取得麥克風失敗：${e.name} ${e.message}`);
                release();
                setStatus('麥克風未授權', 'error');
                toast('請允許此網站使用麥克風');
                return;
            }
            const stopStream = () => stream.getTracks().forEach((t) => t.stop());
            if (cancelled) { stopStream(); release(); setIdleStatus(); return; }

            // 連線時：語音由 App 內建模型辨識，翻譯仍交給 Claude（較準）。離線時兩者都在裝置上做。
            const online = navigator.onLine && !!state.apiKey;
            const translatePreview = (text) => (online
                ? streamClaude(textContent(text, to, conversationContext(role, from)), null, previewOptions()).promise
                : translateOnDevice(text, to, from));
            const translateFinal = (text, onText) => (online
                ? streamClaude(textContent(text, to, conversationContext(role, from)), onText).promise
                : translateOnDevice(text, to, from));

            const bubble = createBubble({ side: role, tag: `${who} · ${LANGS[from].label} → ${LANGS[to].label}${online ? '' : ' · 離線'}` });
            bubble.setPlaceholder('正在錄音…');

            const capture = createPcmCapture(stream);
            const model = pickAsrModel();
            const transcribeAudio = (audio, modelKey) => mtCall(
                { type: 'transcribe', audio, lang: from, model: modelKey, offline: !navigator.onLine }, null, [audio.buffer]);

            let stopped = false;
            let hasPreview = false;
            let hasLiveText = false;
            let lastLive = null;   // 最近一次完成的預覽辨識：{ text, secs, model }

            // 即時預覽：模型是整段辨識的，所以反覆辨識「到目前為止」的語音。
            // 上一輪做完才開始下一輪，裝置越慢預覽就越稀疏，但不會越積越多。
            (async () => {
                let coveredSecs = 0;
                let prevText = '';
                let translated = '';
                while (!stopped && state.live) {
                    await sleep(LIVE_ASR_GAP_MS);
                    if (stopped) break;
                    const liveModel = pickLiveAsrModel(model);
                    if (!liveModel) break;
                    const secs = capture.seconds();
                    if (secs > LIVE_ASR_MAX_S) break;
                    if (secs < 2) continue;                 // 太短的片段模型會亂猜
                    if (secs - coveredSecs < 1) continue;   // 沒有新的語音
                    const audio = prepareSpeech(capture.snapshot());
                    if (!audio) continue;
                    try {
                        const startedAt = performance.now();
                        const text = await transcribeAudio(audio, liveModel);
                        liveAsrSpeed[liveModel] = performance.now() - startedAt;
                        coveredSecs = secs;
                        lastLive = { text, secs, model: liveModel };
                        if (stopped || !text) continue;
                        hasLiveText = true;
                        // 連續兩次辨識開頭一致的部分才算穩定：穩定的正常顯示，尚未穩定的淡色顯示
                        const stable = commonPrefix(prevText, text);
                        prevText = text;
                        bubble.setSource(stable, text.slice(stable.length));
                        const ready = cutAtBoundary(stable);
                        if (!ready || ready === translated) continue;
                        translated = ready;
                        const preview = await translatePreview(ready);
                        if (!stopped) { hasPreview = true; bubble.setPending(preview); }
                    } catch (e) {
                        console.warn('離線即時預覽失敗：', e);   // 預覽失敗不提示，最終結果才處理錯誤
                    }
                }
            })();

            const finish = async () => {
                if (stopped) return;
                stopped = true;
                clearTimeout(autoStop);
                const total = capture.seconds();
                const pcm = capture.snapshot();
                capture.stop();
                stopStream();
                release();
                try {
                    let text;
                    if (lastLive && lastLive.model === model && total - lastLive.secs < 0.6) {
                        // 預覽用的就是主要模型，而且已涵蓋到結尾：直接沿用，不必整段重新辨識
                        text = lastLive.text;
                    } else {
                        const audio = prepareSpeech(pcm);
                        if (!audio) { bubble.remove(); setStatus('沒有聽到聲音'); return; }
                        setStatus('辨識語音中', 'busy');
                        if (!hasLiveText) bubble.setPlaceholder('辨識語音中…');
                        text = await transcribeAudio(audio, model);
                    }
                    if (!text) { bubble.remove(); setStatus('沒有聽到聲音'); return; }
                    bubble.setSource(text);
                    if (!hasPreview) bubble.setPending('');
                    setStatus(online ? '翻譯中' : '離線翻譯中', 'busy');
                    const result = await translateFinal(text, (partial) => bubble.setPending(partial));
                    const btnSpeak = bubble.finalize(result, to);
                    rememberTurn(role, from, text);
                    setIdleStatus();
                    speak(result, to, btnSpeak);
                } catch (err) {
                    // 連線時錯誤多半來自 Claude（Key、額度、網路），交給共用的說明；其餘是辨識本身失敗
                    const fromApi = online && !(err instanceof UserFacingError) && err?.status !== undefined;
                    const msg = err instanceof UserFacingError ? err.message
                        : fromApi ? await explainError(err) : '語音辨識失敗';
                    if (!(err instanceof UserFacingError) && !fromApi) console.error(err);
                    bubble.fail(msg);
                    setStatus(msg, 'error');
                }
            };
            const autoStop = setTimeout(finish, MODEL_REC_MAX_MS);
            session.stop = finish;

            diag(`開始聆聽（內建模型 ${model}）：${from}→${to}${online ? '' : '，離線'}`);
            playBeep();
            requestWakeLock();
            startMeter(role, stream);
            btn.classList.add('is-recording');
            el.voiceHint.textContent = '錄音中… 再點一下結束';
            setStatus(`錄音中（${LANGS[from].label}）`, 'listening');
        }

        function stopRecordingIfAny(reason = 'user') {
            if (activeRec) activeRec.stop(reason);
        }

        // ============================================================
        //  文字模式
        // ============================================================
        let textBusy = false;

        async function translateText() {
            const text = el.textInput.value.trim();
            if (textBusy) return;
            if (!text) { toast('請先輸入內容'); el.textInput.focus(); return; }
            const offline = !navigator.onLine;   // 離線時改用裝置端翻譯，不需要 API Key
            if (!offline && !state.apiKey) { openSettings(); return; }

            const to = state.target;
            textBusy = true;
            el.btnTextSend.disabled = true;
            setStatus(offline ? '離線翻譯中' : '翻譯中', 'busy');

            const bubble = createBubble({ side: 'me', tag: `文字 → ${LANGS[to].label}${offline ? ' · 離線' : ''}` });
            bubble.setSource(text);
            bubble.setPending('');
            try {
                const result = offline
                    ? await translateOnDevice(text, to)
                    : await streamClaude(textContent(text, to), (partial) => bubble.setPending(partial)).promise;
                bubble.finalize(result, to);
                el.textInput.value = '';
                setIdleStatus();
            } catch (err) {
                const msg = await explainError(err);
                bubble.fail(msg);
                setStatus(msg, 'error');
            } finally {
                textBusy = false;
                el.btnTextSend.disabled = false;
            }
        }

        // ============================================================
        //  圖片模式
        // ============================================================
        const readAsDataUrl = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
        });

        const loadImage = (url) => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new UserFacingError('無法讀取這張圖片'));
            img.src = url;
        });

        /** 回傳 { data, mediaType }。格式不支援或檔案太大時才重新編碼成 JPEG，確保 mediaType 與內容一致 */
        async function prepareImage(file, objectUrl) {
            let blob = file;
            let mediaType = file.type;
            const img = await loadImage(objectUrl);
            const longest = Math.max(img.naturalWidth, img.naturalHeight);
            const needsReencode = !API_IMAGE_TYPES.has(mediaType) || file.size > IMAGE_RAW_LIMIT || longest > IMAGE_MAX_SIDE;
            if (needsReencode) {
                const scale = Math.min(1, IMAGE_MAX_SIDE / longest);
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.naturalWidth * scale);
                canvas.height = Math.round(img.naturalHeight * scale);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';   // 透明背景轉 JPEG 時補白
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (!blob) throw new UserFacingError('圖片處理失敗');
                mediaType = 'image/jpeg';
            }
            const dataUrl = await readAsDataUrl(blob);
            return { data: dataUrl.slice(dataUrl.indexOf(',') + 1), mediaType };
        }

        async function translateImage(file) {
            if (!file.type.startsWith('image/')) { toast('請選擇圖片檔'); return; }
            const offline = !navigator.onLine;
            if (!offline && !state.apiKey) { openSettings(); return; }

            const to = state.target;
            const objectUrl = URL.createObjectURL(file);
            objectUrls.push(objectUrl);   // 清除對話時才釋放，圖片預覽才不會失效
            const bubble = createBubble({ side: 'me', tag: `圖片 → ${LANGS[to].label}${offline ? ' · 離線' : ''}`, imageUrl: objectUrl });
            makeThumbnail(objectUrl).then((thumb) => bubble.setThumbnail(thumb));   // 歷史訊息只留縮圖
            bubble.setPending('');
            setStatus('圖片翻譯中', 'busy');
            if (offline) {
                // 離線：先在裝置上辨識文字，再用裝置端翻譯
                try {
                    assertOfflineLangs(to);
                    const text = await ocrImage(objectUrl, to, (p) => setStatus(`辨識文字 ${Math.round(p * 100)}%`, 'busy'));
                    if (!text) throw new UserFacingError('圖片中沒有辨識到文字');
                    bubble.setSource(text);
                    setStatus('離線翻譯中', 'busy');
                    bubble.finalize(await translateLinesOnDevice(text, to), to);
                    setIdleStatus();
                } catch (err) {
                    const msg = await explainError(err);
                    bubble.fail(msg);
                    setStatus(msg, 'error');
                }
                return;
            }
            try {
                const { data, mediaType } = await prepareImage(file, objectUrl);
                const content = [
                    { type: 'image', source: { type: 'base64', media_type: mediaType, data } },
                    { type: 'text', text: IMAGE_PROMPT(LANGS[to].prompt) + glossaryNote() },
                ];
                const result = await streamClaude(content, (partial) => bubble.setPending(partial)).promise;
                bubble.finalize(result, to);
                setIdleStatus();
            } catch (err) {
                const msg = await explainError(err);
                bubble.fail(msg);
                setStatus(msg, 'error');
            }
        }

        // ============================================================
        //  模式與語言切換
        // ============================================================
        const EMPTY_HINTS = {
            voice: '按下「我說」或「對方說」開始對話<br>說完再按一次，就會翻譯並唸出來',
            text: '在下方輸入文字，翻譯成你選的語言',
            image: '拍照或選擇圖片，翻譯圖片裡的文字',
        };

        function renderControls() {
            document.body.dataset.mode = state.mode;
            // 主畫面的字樣與主題色跟著「目前這個模式選的語言」：語音模式是對方語言，
            // 文字／圖片模式是翻譯成的語言（選中文時沒有外語可顯示，沿用對方語言）
            const shown = state.mode === 'voice' || state.target === 'zh' ? state.other : state.target;
            document.body.dataset.other = shown;
            document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.mode === state.mode)));
            for (const [id, current] of [['segOther', state.other], ['segTarget', state.target]]) {
                document.querySelectorAll(`#${id} .seg__btn`).forEach((b) => {
                    const on = b.dataset.lang === current;
                    b.setAttribute('aria-pressed', String(on));
                    // 選中的語言可能被捲到看不見的地方，帶回畫面內
                    if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                });
            }
            el.langLabel.textContent = state.mode === 'voice' ? '對方語言' : '翻譯成';
            const glyph = LANGS[state.other].glyph;
            el.micOtherGlyph.textContent = glyph;
            el.micOtherGlyph.toggleAttribute('data-latin', state.other === 'en');
            el.emptyOther.textContent = LANGS[shown].glyph;
            el.emptyHint.innerHTML = EMPTY_HINTS[state.mode];
        }

        function switchMode(mode) {
            if (state.mode === mode) return;
            stopRecordingIfAny();
            state.mode = mode;
            renderControls();
            if (el.status.dataset.state !== 'busy') setIdleStatus();
        }

        // ============================================================
        //  設定視窗
        // ============================================================
        function openSettings() {
            el.apiKey.value = state.apiKey;
            el.modelSelect.value = state.model;
            el.liveToggle.checked = state.live;
            $('fastPreviewToggle').checked = state.fastPreview;
            $('asrEngineSelect').value = state.asrEngine;
            $('glossaryInput').value = store.get('tm_glossary', '');
            el.modal.hidden = false;
            refreshOfflineStatus();
            if (!state.apiKey) el.apiKey.focus();
        }
        function closeSettings() { el.modal.hidden = true; }

        function saveSettings(event) {
            event.preventDefault();
            const key = el.apiKey.value.trim();
            // 詞彙與離線設定不需要 Key，離線或還沒有 Key 時也要能儲存
            const glossaryRaw = $('glossaryInput').value;
            customGlossary = parseGlossary(glossaryRaw);
            store.set('tm_glossary', glossaryRaw);
            if (!key && navigator.onLine && !state.apiKey) { toast('請貼上 API Key'); el.apiKey.focus(); return; }
            state.apiKey = key;
            state.model = pick(el.modelSelect.value, MODELS, MODELS[0]);
            state.live = el.liveToggle.checked;
            store.set('tm_anthropic_key', state.apiKey);
            store.set('tm_model', state.model);
            store.set('tm_live', state.live ? '1' : '0');
            state.fastPreview = $('fastPreviewToggle').checked;
            store.set('tm_fast_preview', state.fastPreview ? '1' : '0');
            state.asrEngine = pick($('asrEngineSelect').value, ['browser', 'model'], 'browser');
            store.set('tm_asr_engine', state.asrEngine);
            closeSettings();
            setIdleStatus();
            toast('設定已儲存');
        }

        // ============================================================
        //  事件綁定與啟動
        // ============================================================
        el.micMe.addEventListener('click', () => onMicClick('me', el.micMe));
        el.micOther.addEventListener('click', () => onMicClick('other', el.micOther));

        document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => switchMode(t.dataset.mode)));
        const fillSeg = (id, keys) => $(id).append(...keys.map((k) => {
            const b = document.createElement('button');
            b.className = 'seg__btn';
            b.type = 'button';
            b.dataset.lang = k;
            b.textContent = LANGS[k].label;
            return b;
        }));
        fillSeg('segOther', OTHER_LANGS);
        fillSeg('segTarget', LANG_KEYS);
        document.querySelectorAll('#segOther .seg__btn').forEach((b) => b.addEventListener('click', () => {
            if (state.other !== b.dataset.lang) conversation.length = 0;   // 換了對方的語言＝換了對象，之前的對話不再當前文
            state.other = b.dataset.lang;
            store.set('tm_other', state.other);
            renderControls();
            warmOfflineModels();
        }));
        document.querySelectorAll('#segTarget .seg__btn').forEach((b) => b.addEventListener('click', () => {
            state.target = b.dataset.lang;
            store.set('tm_target', state.target);
            renderControls();
        }));

        el.btnTextSend.addEventListener('click', translateText);
        $('btnTextClear').addEventListener('click', () => { el.textInput.value = ''; el.textInput.focus(); });
        el.textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); translateText(); }
        });

        const fileInput = $('imageFileInput');
        const captureInput = $('imageCaptureInput');
        $('btnImgUpload').addEventListener('click', () => fileInput.click());
        $('btnImgCapture').addEventListener('click', () => captureInput.click());
        for (const input of [fileInput, captureInput]) {
            input.addEventListener('change', () => {
                const file = input.files?.[0];
                input.value = '';   // 允許重複選同一張
                if (file) translateImage(file);
            });
        }

        $('btnClear').addEventListener('click', clearConversation);
        $('btnSettings').addEventListener('click', openSettings);
        $('btnModalCancel').addEventListener('click', closeSettings);
        $('settingsForm').addEventListener('submit', saveSettings);
        el.modal.addEventListener('click', (e) => { if (e.target === el.modal) closeSettings(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el.modal.hidden) closeSettings(); });

        window.addEventListener('online', () => { setIdleStatus(); toast('已恢復連線'); });
        window.addEventListener('offline', () => { stopRecordingIfAny(); setIdleStatus(); warmOfflineModels(); toast(deviceSupported ? '目前離線：改用裝置端翻譯' : '目前離線：可瀏覽對話與朗讀，翻譯需連線'); });
        for (const id of Object.keys(MODEL_PACKS)) {
            const b = $(`btnModel-${id}`);
            b.addEventListener('click', () => downloadModelPack(id, b));
        }
        warmOfflineModels();    // 離線開啟 App 時先載入模型
        refreshLocalSpeech();   // 先查好離線語音狀態，離線時按麥克風才能立即判斷
        $('btnOfflineDownload').addEventListener('click', downloadOfflinePacks);
        /** 診斷資訊：環境摘要＋最近的事件。不含說話內容、譯文或 API Key */
        function buildDiagReport() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const env = [
                `時間：${new Date().toISOString()}`,
                `瀏覽器：${navigator.userAgent}`,
                `開啟方式：${IS_STANDALONE ? '主畫面（獨立 App）' : '瀏覽器分頁'}`,
                `連線：${navigator.onLine ? '是' : '否'}｜已設定 Key：${state.apiKey ? '是' : '否'}｜模型：${state.model}`,
                `語音辨識：${SR ? '有' : '無'}｜辨識方式：${state.asrEngine}｜即時預覽：${state.live ? '開' : '關'}`,
                `跨來源隔離：${self.crossOriginIsolated ? '是' : '否'}｜Service Worker：${navigator.serviceWorker?.controller ? '已接管' : '未接管'}`,
                `螢幕喚醒：${navigator.wakeLock ? '支援' : '不支援'}｜錄音：${navigator.mediaDevices?.getUserMedia ? '支援' : '不支援'}`,
                `已下載的離線模型：${[...modelKeysReady].join(', ') || '無'}`,
            ];
            return `【譯機診斷資訊】\n${env.join('\n')}\n\n【最近事件】\n${diagLog.join('\n') || '（沒有紀錄）'}`;
        }
        $('btnCopyDiag').addEventListener('click', async () => {
            const report = buildDiagReport();
            try {
                await navigator.clipboard.writeText(report);
                toast('已複製診斷資訊');
            } catch {
                prompt('請全選並複製以下內容：', report);   // 剪貼簿不能用時，讓使用者自己全選複製
            }
        });
        diag(`App 啟動：${IS_STANDALONE ? '主畫面' : '分頁'}，${navigator.onLine ? '連線' : '離線'}，Key=${state.apiKey ? '有' : '無'}，隔離=${self.crossOriginIsolated ? '是' : '否'}`);

        document.addEventListener('visibilitychange', () => {
            diag(`頁面${document.hidden ? '離開畫面' : '回到畫面'}`);
            if (document.hidden) stopRecordingIfAny('hidden');
        });

        renderControls();
        restoreHistory();   // 把上次留下的訊息放回畫面
        setIdleStatus();
        if (!state.apiKey && navigator.onLine) openSettings();   // 離線時不需要 Key，不打擾

        // PWA：註冊 service worker，就緒後預先載入 SDK 讓它進入離線快取
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname))) {
            // 有下載離線模型時，service worker 會幫頁面加上跨來源隔離標頭，模型才能用多執行緒（快約一倍）。
            // 頁面若是在旗標寫入或 service worker 接手之前載入的，還沒有隔離，所以重新載入一次。
            const ensureIsolation = () => {
                if (!wantsIsolation()) return false;   // 只用連線翻譯時不需要隔離
                if (self.crossOriginIsolated || !navigator.serviceWorker.controller) return false;
                // 不打斷正在進行的事。畫面上有歷史訊息沒關係，重新載入後會還原
                if (activeRec || el.status.dataset.state === 'busy' || el.apiKey.value || !navigator.onLine) return false;
                try {
                    if (sessionStorage.getItem('tm_coi')) return false;   // 只試一次，避免不支援時無限重整
                    sessionStorage.setItem('tm_coi', '1');
                } catch { return false; }
                location.reload();
                return true;
            };
            navigator.serviceWorker.addEventListener('controllerchange', ensureIsolation);
            syncIsolationFlag()
                .then(() => navigator.serviceWorker.register('sw.js'))
                .then(() => navigator.serviceWorker.ready)
                .then(() => { if (!ensureIsolation() && navigator.onLine) loadSdk().catch(() => {}); })
                .catch((e) => console.warn('Service worker 註冊失敗：', e));
        } else if (navigator.onLine) {
            loadSdk().catch(() => {});
        }
    </script>
</body>
</html>
