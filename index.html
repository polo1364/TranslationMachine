                    ctx.close().catch(() => {});
                },
            };
        }

        /**
         * 送進模型前的整理：切掉頭尾的靜音、把音量拉到一致。
         * 靜音會讓 Whisper 憑空生出字句，音量太小則容易聽錯。完全沒有人聲時回傳 null。
         */
        function prepareSpeech(pcm) {
            const FRAME = 320;   // 20 毫秒
            const frames = Math.floor(pcm.length / FRAME);
            if (!frames) return null;
            const rms = new Float32Array(frames);
            let maxRms = 0;
            for (let f = 0; f < frames; f++) {
                let sum = 0;
                for (let i = f * FRAME, end = i + FRAME; i < end; i++) sum += pcm[i] * pcm[i];
                rms[f] = Math.sqrt(sum / FRAME);
                if (rms[f] > maxRms) maxRms = rms[f];
            }
            if (maxRms < 0.004) return null;   // 整段幾乎無聲
            const threshold = Math.max(0.003, maxRms * 0.08);
            let first = 0;
            let last = frames - 1;
            while (first < frames && rms[first] < threshold) first++;
            while (last > first && rms[last] < threshold) last--;
            const PAD = 15;   // 頭尾各留 0.3 秒，避免切到字頭字尾
            const start = Math.max(0, first - PAD) * FRAME;
            const end = Math.min(frames, last + 1 + PAD) * FRAME;
            if (end - start < 16000 * 0.3) return null;

            const out = pcm.slice(start, end);
            let peak = 0;
            for (let i = 0; i < out.length; i++) { const a = Math.abs(out[i]); if (a > peak) peak = a; }
            const gain = Math.min(20, 0.9 / peak);
            if (gain > 1.05) for (let i = 0; i < out.length; i++) out[i] *= gain;
            return out;
        }

        async function startModelRecording(role, btn) {
            const from = role === 'me' ? 'zh' : state.other;
            const to = role === 'me' ? state.other : 'zh';
            const who = role === 'me' ? '我' : '對方';

            // 先佔住「錄音中」狀態，避免等麥克風授權時被重複點擊
            let cancelled = false;
            const session = { stop() { cancelled = true; } };
            activeRec = session;
            activeBtn = btn;

            const release = () => {
                if (activeRec !== session) return;
                activeRec = null;
                activeBtn = null;
                stopMeter();
                btn.classList.remove('is-recording');
                el.voiceHint.textContent = '點一下開始說話，再點一下結束';
            };

            let stream;
            try {
                // 單聲道並開啟降噪、回音消除、自動增益，嘈雜環境下辨識較穩
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                });
            } catch {
                release();
                setStatus('麥克風未授權', 'error');
                toast('請允許此網站使用麥克風');
                return;
            }
            const stopStream = () => stream.getTracks().forEach((t) => t.stop());
            if (cancelled) { stopStream(); release(); setIdleStatus(); return; }

            const bubble = createBubble({ side: role, tag: `${who} · ${LANGS[from].label} → ${LANGS[to].label} · 離線` });
            bubble.setPlaceholder('正在錄音…');

            const capture = createPcmCapture(stream);
            const model = pickAsrModel();
            const transcribeAudio = (audio, modelKey) => mtCall(
                { type: 'transcribe', audio, lang: from, model: modelKey, offline: !navigator.onLine }, null, [audio.buffer]);

            let stopped = false;
            let hasPreview = false;
            let hasLiveText = false;
            let lastLive = null;   // 最近一次完成的預覽辨識：{ text, secs, model }

            // 即時預覽：模型是整段辨識的，所以反覆辨識「到目前為止」的語音。
            // 上一輪做完才開始下一輪，裝置越慢預覽就越稀疏，但不會越積越多。
            (async () => {
                let coveredSecs = 0;
                let prevText = '';
                let translated = '';
                while (!stopped && state.live) {
                    await sleep(LIVE_ASR_GAP_MS);
                    if (stopped) break;
                    const liveModel = pickLiveAsrModel(model);
                    if (!liveModel) break;
                    const secs = capture.seconds();
                    if (secs > LIVE_ASR_MAX_S) break;
                    if (secs < 2) continue;                 // 太短的片段模型會亂猜
                    if (secs - coveredSecs < 1) continue;   // 沒有新的語音
                    const audio = prepareSpeech(capture.snapshot());
                    if (!audio) continue;
                    try {
                        const startedAt = performance.now();
                        const text = await transcribeAudio(audio, liveModel);
                        liveAsrSpeed[liveModel] = performance.now() - startedAt;
                        coveredSecs = secs;
                        lastLive = { text, secs, model: liveModel };
                        if (stopped || !text) continue;
                        hasLiveText = true;
                        // 連續兩次辨識開頭一致的部分才算穩定：穩定的正常顯示，尚未穩定的淡色顯示
                        const stable = commonPrefix(prevText, text);
                        prevText = text;
                        bubble.setSource(stable, text.slice(stable.length));
                        const ready = cutAtBoundary(stable);
                        if (!ready || ready === translated) continue;
                        translated = ready;
                        const preview = await translateOnDevice(ready, to, from);
                        if (!stopped) { hasPreview = true; bubble.setPending(preview); }
                    } catch (e) {
                        console.warn('離線即時預覽失敗：', e);   // 預覽失敗不提示，最終結果才處理錯誤
                    }
                }
            })();

            const finish = async () => {
                if (stopped) return;
                stopped = true;
                clearTimeout(autoStop);
                const total = capture.seconds();
                const pcm = capture.snapshot();
                capture.stop();
                stopStream();
                release();
                try {
                    let text;
                    if (lastLive && lastLive.model === model && total - lastLive.secs < 0.6) {
                        // 預覽用的就是主要模型，而且已涵蓋到結尾：直接沿用，不必整段重新辨識
                        text = lastLive.text;
                    } else {
                        const audio = prepareSpeech(pcm);
                        if (!audio) { bubble.remove(); setStatus('沒有聽到聲音'); return; }
                        setStatus('辨識語音中', 'busy');
                        if (!hasLiveText) bubble.setPlaceholder('辨識語音中…');
                        text = await transcribeAudio(audio, model);
                    }
                    if (!text) { bubble.remove(); setStatus('沒有聽到聲音'); return; }
                    bubble.setSource(text);
                    if (!hasPreview) bubble.setPending('');
                    setStatus('離線翻譯中', 'busy');
                    const result = await translateOnDevice(text, to, from);
                    const btnSpeak = bubble.finalize(result, to);
                    setIdleStatus();
                    speak(result, to, btnSpeak);
                } catch (err) {
                    const msg = err instanceof UserFacingError ? err.message : '離線語音辨識失敗';
                    if (!(err instanceof UserFacingError)) console.error(err);
                    bubble.fail(msg);
                    setStatus(msg, 'error');
                }
            };
            const autoStop = setTimeout(finish, MODEL_REC_MAX_MS);
            session.stop = finish;

            playBeep();
            startMeter(role, stream);
            btn.classList.add('is-recording');
            el.voiceHint.textContent = '錄音中… 再點一下結束';
            setStatus(`錄音中（${LANGS[from].label}）`, 'listening');
        }

        function stopRecordingIfAny() {
            if (activeRec) activeRec.stop();
        }

        // ============================================================
        //  文字模式
        // ============================================================
        let textBusy = false;

        async function translateText() {
            const text = el.textInput.value.trim();
            if (textBusy) return;
            if (!text) { toast('請先輸入內容'); el.textInput.focus(); return; }
            const offline = !navigator.onLine;   // 離線時改用裝置端翻譯，不需要 API Key
            if (!offline && !state.apiKey) { openSettings(); return; }

            const to = state.target;
            textBusy = true;
            el.btnTextSend.disabled = true;
            setStatus(offline ? '離線翻譯中' : '翻譯中', 'busy');

            const bubble = createBubble({ side: 'me', tag: `文字 → ${LANGS[to].label}${offline ? ' · 離線' : ''}` });
            bubble.setSource(text);
            bubble.setPending('');
            try {
                const result = offline
                    ? await translateOnDevice(text, to)
                    : await streamClaude(textContent(text, to), (partial) => bubble.setPending(partial)).promise;
                bubble.finalize(result, to);
                el.textInput.value = '';
                setIdleStatus();
            } catch (err) {
                const msg = await explainError(err);
                bubble.fail(msg);
                setStatus(msg, 'error');
            } finally {
                textBusy = false;
                el.btnTextSend.disabled = false;
            }
        }

        // ============================================================
        //  圖片模式
        // ============================================================
        const readAsDataUrl = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
        });

        const loadImage = (url) => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new UserFacingError('無法讀取這張圖片'));
            img.src = url;
        });

        /** 回傳 { data, mediaType }。格式不支援或檔案太大時才重新編碼成 JPEG，確保 mediaType 與內容一致 */
        async function prepareImage(file, objectUrl) {
            let blob = file;
            let mediaType = file.type;
            const img = await loadImage(objectUrl);
            const longest = Math.max(img.naturalWidth, img.naturalHeight);
            const needsReencode = !API_IMAGE_TYPES.has(mediaType) || file.size > IMAGE_RAW_LIMIT || longest > IMAGE_MAX_SIDE;
            if (needsReencode) {
                const scale = Math.min(1, IMAGE_MAX_SIDE / longest);
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.naturalWidth * scale);
                canvas.height = Math.round(img.naturalHeight * scale);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';   // 透明背景轉 JPEG 時補白
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (!blob) throw new UserFacingError('圖片處理失敗');
                mediaType = 'image/jpeg';
            }
            const dataUrl = await readAsDataUrl(blob);
            return { data: dataUrl.slice(dataUrl.indexOf(',') + 1), mediaType };
        }

        async function translateImage(file) {
            if (!file.type.startsWith('image/')) { toast('請選擇圖片檔'); return; }
            const offline = !navigator.onLine;
            if (!offline && !state.apiKey) { openSettings(); return; }

            const to = state.target;
            const objectUrl = URL.createObjectURL(file);
            objectUrls.push(objectUrl);   // 清除對話時才釋放，圖片預覽才不會失效
            const bubble = createBubble({ side: 'me', tag: `圖片 → ${LANGS[to].label}${offline ? ' · 離線' : ''}`, imageUrl: objectUrl });
            bubble.setPending('');
            setStatus('圖片翻譯中', 'busy');
            if (offline) {
                // 離線：先在裝置上辨識文字，再用裝置端翻譯
                try {
                    const text = await ocrImage(objectUrl, to, (p) => setStatus(`辨識文字 ${Math.round(p * 100)}%`, 'busy'));
                    if (!text) throw new UserFacingError('圖片中沒有辨識到文字');
                    bubble.setSource(text);
                    setStatus('離線翻譯中', 'busy');
                    bubble.finalize(await translateLinesOnDevice(text, to), to);
                    setIdleStatus();
                } catch (err) {
                    const msg = await explainError(err);
                    bubble.fail(msg);
                    setStatus(msg, 'error');
                }
                return;
            }
            try {
                const { data, mediaType } = await prepareImage(file, objectUrl);
                const content = [
                    { type: 'image', source: { type: 'base64', media_type: mediaType, data } },
                    { type: 'text', text: IMAGE_PROMPT(LANGS[to].prompt) + glossaryNote() },
                ];
                const result = await streamClaude(content, (partial) => bubble.setPending(partial)).promise;
                bubble.finalize(result, to);
                setIdleStatus();
            } catch (err) {
                const msg = await explainError(err);
                bubble.fail(msg);
                setStatus(msg, 'error');
            }
        }

        // ============================================================
        //  模式與語言切換
        // ============================================================
        const EMPTY_HINTS = {
            voice: '按下「我說」或「對方說」開始對話<br>說完再按一次，就會翻譯並唸出來',
            text: '在下方輸入文字，翻譯成你選的語言',
            image: '拍照或選擇圖片，翻譯圖片裡的文字',
        };

        function renderControls() {
            document.body.dataset.mode = state.mode;
            document.body.dataset.other = state.other;
            document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.mode === state.mode)));
            document.querySelectorAll('#segOther .seg__btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.other)));
            document.querySelectorAll('#segTarget .seg__btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.target)));
            el.langLabel.textContent = state.mode === 'voice' ? '對方語言' : '翻譯成';
            const glyph = LANGS[state.other].glyph;
            el.micOtherGlyph.textContent = glyph;
            el.micOtherGlyph.toggleAttribute('data-latin', state.other === 'en');
            el.emptyOther.textContent = glyph;
            el.emptyHint.innerHTML = EMPTY_HINTS[state.mode];
        }

        function switchMode(mode) {
            if (state.mode === mode) return;
            stopRecordingIfAny();
            state.mode = mode;
            renderControls();
            if (el.status.dataset.state !== 'busy') setIdleStatus();
        }

        // ============================================================
        //  設定視窗
        // ============================================================
        function openSettings() {
            el.apiKey.value = state.apiKey;
            el.modelSelect.value = state.model;
            el.liveToggle.checked = state.live;
            $('glossaryInput').value = store.get('tm_glossary', '');
            el.modal.hidden = false;
            refreshOfflineStatus();
            if (!state.apiKey) el.apiKey.focus();
        }
        function closeSettings() { el.modal.hidden = true; }

        function saveSettings(event) {
            event.preventDefault();
            const key = el.apiKey.value.trim();
            // 詞彙與離線設定不需要 Key，離線或還沒有 Key 時也要能儲存
            const glossaryRaw = $('glossaryInput').value;
            customGlossary = parseGlossary(glossaryRaw);
            store.set('tm_glossary', glossaryRaw);
            if (!key && navigator.onLine && !state.apiKey) { toast('請貼上 API Key'); el.apiKey.focus(); return; }
            state.apiKey = key;
            state.model = pick(el.modelSelect.value, MODELS, MODELS[0]);
            state.live = el.liveToggle.checked;
            store.set('tm_anthropic_key', state.apiKey);
            store.set('tm_model', state.model);
            store.set('tm_live', state.live ? '1' : '0');
            closeSettings();
            setIdleStatus();
            toast('設定已儲存');
        }

        // ============================================================
        //  事件綁定與啟動
        // ============================================================
        el.micMe.addEventListener('click', () => onMicClick('me', el.micMe));
        el.micOther.addEventListener('click', () => onMicClick('other', el.micOther));

        document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => switchMode(t.dataset.mode)));
        document.querySelectorAll('#segOther .seg__btn').forEach((b) => b.addEventListener('click', () => {
            state.other = b.dataset.lang;
            store.set('tm_other', state.other);
            renderControls();
            warmOfflineModels();
        }));
        document.querySelectorAll('#segTarget .seg__btn').forEach((b) => b.addEventListener('click', () => {
            state.target = b.dataset.lang;
            store.set('tm_target', state.target);
            renderControls();
        }));

        el.btnTextSend.addEventListener('click', translateText);
        $('btnTextClear').addEventListener('click', () => { el.textInput.value = ''; el.textInput.focus(); });
        el.textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); translateText(); }
        });

        const fileInput = $('imageFileInput');
        const captureInput = $('imageCaptureInput');
        $('btnImgUpload').addEventListener('click', () => fileInput.click());
        $('btnImgCapture').addEventListener('click', () => captureInput.click());
        for (const input of [fileInput, captureInput]) {
            input.addEventListener('change', () => {
                const file = input.files?.[0];
                input.value = '';   // 允許重複選同一張
                if (file) translateImage(file);
            });
        }

        $('btnClear').addEventListener('click', clearConversation);
        $('btnSettings').addEventListener('click', openSettings);
        $('btnModalCancel').addEventListener('click', closeSettings);
        $('settingsForm').addEventListener('submit', saveSettings);
        el.modal.addEventListener('click', (e) => { if (e.target === el.modal) closeSettings(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el.modal.hidden) closeSettings(); });

        window.addEventListener('online', () => { setIdleStatus(); toast('已恢復連線'); });
        window.addEventListener('offline', () => { stopRecordingIfAny(); setIdleStatus(); warmOfflineModels(); toast(deviceSupported ? '目前離線：改用裝置端翻譯' : '目前離線：可瀏覽對話與朗讀，翻譯需連線'); });
        for (const id of Object.keys(MODEL_PACKS)) {
            const b = $(`btnModel-${id}`);
            b.addEventListener('click', () => downloadModelPack(id, b));
        }
        warmOfflineModels();    // 離線開啟 App 時先載入模型
        refreshLocalSpeech();   // 先查好離線語音狀態，離線時按麥克風才能立即判斷
        $('btnOfflineDownload').addEventListener('click', downloadOfflinePacks);
        document.addEventListener('visibilitychange', () => { if (document.hidden) stopRecordingIfAny(); });

        renderControls();
        setIdleStatus();
        if (!state.apiKey && navigator.onLine) openSettings();   // 離線時不需要 Key，不打擾

        // PWA：註冊 service worker，就緒後預先載入 SDK 讓它進入離線快取
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname))) {
            // service worker 會幫頁面加上跨來源隔離標頭，離線模型才能用多執行緒（快約一倍）。
            // 第一次造訪時頁面是在 service worker 接手前載入的，還沒有隔離，所以重新載入一次。
            const ensureIsolation = () => {
                if (self.crossOriginIsolated || !navigator.serviceWorker.controller) return false;
                if (el.screen.querySelector('.msg') || el.apiKey.value || !navigator.onLine) return false;   // 不打斷使用中的畫面
                try {
                    if (sessionStorage.getItem('tm_coi')) return false;   // 只試一次，避免不支援時無限重整
                    sessionStorage.setItem('tm_coi', '1');
                } catch { return false; }
                location.reload();
                return true;
            };
            navigator.serviceWorker.addEventListener('controllerchange', ensureIsolation);
            navigator.serviceWorker.register('sw.js')
                .then(() => navigator.serviceWorker.ready)
                .then(() => { if (!ensureIsolation() && navigator.onLine) loadSdk().catch(() => {}); })
                .catch((e) => console.warn('Service worker 註冊失敗：', e));
        } else if (navigator.onLine) {
            loadSdk().catch(() => {});
        }
    </script>
</body>
</html>
